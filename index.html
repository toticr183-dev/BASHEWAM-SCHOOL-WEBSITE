<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Bashewam School | Admin Portal</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            line-height: 1.5;
        }

        /* LOGIN SCREEN */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f2b3d 0%, #1a4a6f 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 48px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 30px 50px rgba(0,0,0,0.3);
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card h2 {
            color: #0f2b3d;
            margin-bottom: 8px;
            font-size: 1.8rem;
        }

        .login-card p {
            color: #5b6e8c;
            margin-bottom: 28px;
        }

        .login-card input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 60px;
            font-size: 1rem;
            margin-bottom: 20px;
            outline: none;
            transition: 0.2s;
        }

        .login-card input:focus {
            border-color: #1e4a76;
        }

        .login-card button {
            width: 100%;
            padding: 14px;
            background: #1e4a76;
            color: white;
            border: none;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        .login-error {
            color: #dc2626;
            margin-top: 16px;
            font-size: 0.85rem;
        }

        /* MAIN APP (HIDDEN UNTIL LOGIN) */
        .app-wrapper {
            display: flex;
            min-height: 100vh;
            display: none;
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #0f2b3d 0%, #1a4a6f 100%);
            color: white;
            transition: all 0.3s;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 32px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header h2 i {
            font-size: 1.8rem;
            color: #facc15;
        }

        .nav-links {
            list-style: none;
            padding: 24px 0;
        }

        .nav-links li {
            padding: 12px 24px;
            margin: 4px 0;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            font-weight: 500;
            color: rgba(255,255,255,0.8);
            border-left: 3px solid transparent;
        }

        .nav-links li i {
            width: 24px;
        }

        .nav-links li.active {
            background: rgba(255,255,255,0.12);
            border-left-color: #facc15;
            color: white;
        }

        .main-content {
            flex: 1;
            padding: 28px 36px;
            overflow-x: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            background: white;
            padding: 16px 28px;
            border-radius: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-title h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0f2b3d;
        }

        .btn-primary, .btn-outline {
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: #1e4a76;
            color: white;
            border: none;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #cbd5e1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            border-radius: 28px;
            padding: 20px 24px;
            border: 1px solid #e9eef3;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: #0f2b3d;
        }

        .section-card {
            background: white;
            border-radius: 28px;
            padding: 24px 28px;
            margin-bottom: 32px;
            border: 1px solid #eef3fa;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 24px;
            border-left: 4px solid #facc15;
            padding-left: 18px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group input, .input-group select {
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
        }

        .directory-table {
            width: 100%;
            border-collapse: collapse;
        }

        .directory-table th, .directory-table td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #f0f2f5;
        }

        .directory-table th {
            background: #f8fafc;
        }

        .log-entry {
            background: #f8fafc;
            padding: 14px 18px;
            border-radius: 20px;
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        @media (max-width: 900px) {
            .sidebar { width: 80px; }
            .sidebar-header h2 span, .sidebar-header p, .nav-links li span { display: none; }
            .stats-grid { grid-template-columns: repeat(2,1fr); }
        }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <h2><i class="fas fa-lock"></i> Admin Access</h2>
        <p>Enter password to manage school</p>
        <input type="password" id="adminPassword" placeholder="Password">
        <button onclick="attemptLogin()">Unlock Portal</button>
        <div id="loginError" class="login-error"></div>
    </div>
</div>

<!-- MAIN APP (HIDDEN UNTIL LOGIN) -->
<div id="appWrapper" class="app-wrapper">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-school"></i> <span>Bashewam</span></h2>
            <p>Admin Portal</p>
        </div>
        <ul class="nav-links">
            <li class="active" data-tab="dashboard"><i class="fas fa-chart-line"></i> <span>Dashboard</span></li>
            <li data-tab="register"><i class="fas fa-user-plus"></i> <span>New Registration</span></li>
            <li data-tab="directory"><i class="fas fa-address-book"></i> <span>Directory</span></li>
            <li data-tab="logs"><i class="fas fa-history"></i> <span>Operations Log</span></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <div class="page-title">
                <h1 id="mainHeading">Dashboard</h1>
                <p id="subHeading">School insights & live stats</p>
            </div>
            <div class="action-buttons">
                <button class="btn-outline" id="exportBtn"><i class="fas fa-download"></i> Export</button>
                <button class="btn-primary" id="quickActionBtn"><i class="fas fa-sync-alt"></i> Sync</button>
                <button class="btn-outline" id="logoutBtn" style="border-color:#dc2626; color:#dc2626;"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
        <div id="dynamicContainer"></div>
    </main>
</div>

<script>
    // ===== PASSWORD (CHANGE THIS) =====
    const ADMIN_PASSWORD = "bashewam2026";

    // ===== CHECK LOGIN STATUS =====
    function isLoggedIn() {
        return sessionStorage.getItem('bashewam_logged_in') === 'true';
    }

    function attemptLogin() {
        const password = document.getElementById('adminPassword').value;
        if (password === ADMIN_PASSWORD) {
            sessionStorage.setItem('bashewam_logged_in', 'true');
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('appWrapper').style.display = 'flex';
            loadData(); // initialize the app after login
        } else {
            document.getElementById('loginError').innerText = '❌ Incorrect password';
        }
    }

    function logout() {
        sessionStorage.removeItem('bashewam_logged_in');
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('appWrapper').style.display = 'none';
    }

    // ===== SCHOOL DATABASE (LOCALSTORAGE) =====
    let schoolData = {
        students: [],
        staff: [],
        activities: []
    };

    function loadData() {
        const stored = localStorage.getItem('bashewam_school_db');
        if (stored) {
            schoolData = JSON.parse(stored);
        } else {
            schoolData = {
                students: [
                    { id: "STU1001", name: "Biruk Alemu", grade: "Grade 10", status: "Active", registered: "2025-02-10" },
                    { id: "STU1002", name: "Meron Daniel", grade: "Grade 11", status: "Active", registered: "2025-02-15" },
                    { id: "STU1003", name: "Eden Worku", grade: "Grade 9", status: "Active", registered: "2025-02-20" }
                ],
                staff: [
                    { id: "TCH201", name: "Mr. Abebe Kebede", role: "Mathematics", status: "Active" },
                    { id: "TCH202", name: "Ms. Tigist Mekonnen", role: "English", status: "Active" }
                ],
                activities: [
                    { log: "✅ System initialized", timestamp: new Date().toLocaleString() }
                ]
            };
            saveData();
        }
        renderCurrentTab();
    }

    function saveData() {
        localStorage.setItem('bashewam_school_db', JSON.stringify(schoolData));
    }

    function addActivityLog(message) {
        schoolData.activities.unshift({ log: message, timestamp: new Date().toLocaleString() });
        if (schoolData.activities.length > 25) schoolData.activities.pop();
        saveData();
        if (currentTab === 'logs') renderLogsView();
    }

    // ===== RENDER FUNCTIONS =====
    function renderDashboard() {
        return `
            <div class="stats-grid">
                <div class="stat-card"><h3>📚 TOTAL STUDENTS</h3><div class="stat-number">${schoolData.students.length}</div></div>
                <div class="stat-card"><h3>👩‍🏫 STAFF</h3><div class="stat-number">${schoolData.staff.length}</div></div>
                <div class="stat-card"><h3>✅ ACTIVE</h3><div class="stat-number">${schoolData.students.filter(s => s.status === 'Active').length}</div></div>
                <div class="stat-card"><h3>🏫 LIVE OPS</h3><div class="stat-number">3</div></div>
            </div>
            <div class="section-card">
                <div class="section-title"><i class="fas fa-history"></i> Recent Activity</div>
                ${schoolData.activities.slice(0,3).map(act => `<div class="log-entry"><i class="fas fa-check-circle"></i> ${act.log} <span style="margin-left:auto;">${act.timestamp}</span></div>`).join('')}
                <button class="btn-outline" id="viewAllLogsBtn" style="margin-top:16px">View Full Log</button>
            </div>
        `;
    }

    function renderRegisterView() {
        return `
            <div class="section-card">
                <div class="section-title"><i class="fas fa-pen-alt"></i> New Registration</div>
                <form id="registerForm">
                    <div class="form-row">
                        <div class="input-group"><label>Full Name</label><input type="text" id="regName" required></div>
                        <div class="input-group"><label>Role</label><select id="regRole"><option>Student</option><option>Staff</option></select></div>
                        <div class="input-group"><label>Grade/Dept</label><input type="text" id="regGrade"></div>
                    </div>
                    <button type="submit" class="btn-primary">Register</button>
                </form>
                <p id="regFeedback" style="margin-top:16px; color:#15803d;"></p>
            </div>
        `;
    }

    function renderDirectoryView() {
        const all = [...schoolData.students.map(s=>({...s, type:'Student'})), ...schoolData.staff.map(t=>({...t, type:'Staff'}))];
        return `
            <div class="section-card">
                <div class="section-title"><i class="fas fa-address-card"></i> Directory</div>
                <table class="directory-table"><thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Grade/Role</th><th>Status</th><th></th></tr></thead><tbody>
                ${all.map(m => `<tr><td>${m.id||'—'}</td><td>${m.name}</td><td>${m.type}</td><td>${m.grade||m.role||'—'}</td><td>${m.status}</td><td><button class="btn-outline" style="padding:4px 12px" onclick="removeEntry('${m.name}')">Remove</button></td></tr>`).join('')}
                </tbody></table>
            </div>
        `;
    }

    function renderLogsView() {
        return `
            <div class="section-card">
                <div class="section-title"><i class="fas fa-terminal"></i> Operation Log</div>
                ${schoolData.activities.map(act => `<div class="log-entry"><i class="fas fa-clock"></i> ${act.log} <span style="margin-left:auto">${act.timestamp}</span></div>`).join('')}
                <button id="clearLogBtn" class="btn-outline" style="margin-top:20px">Clear Log</button>
            </div>
        `;
    }

    let currentTab = 'dashboard';
    function switchTab(tabId) {
        currentTab = tabId;
        renderCurrentTab();
        document.querySelectorAll('.nav-links li').forEach(li => {
            li.classList.toggle('active', li.getAttribute('data-tab') === tabId);
        });
        const titles = { dashboard:'Dashboard', register:'Registration', directory:'Directory', logs:'Operations' };
        document.getElementById('mainHeading').innerText = titles[tabId];
    }

    function renderCurrentTab() {
        const container = document.getElementById('dynamicContainer');
        if (currentTab === 'dashboard') container.innerHTML = renderDashboard();
        if (currentTab === 'register') container.innerHTML = renderRegisterView();
        if (currentTab === 'directory') container.innerHTML = renderDirectoryView();
        if (currentTab === 'logs') container.innerHTML = renderLogsView();
        attachEvents();
    }

    function attachEvents() {
        const form = document.getElementById('registerForm');
        if (form) {
            form.onsubmit = (e) => {
                e.preventDefault();
                const name = document.getElementById('regName').value;
                const role = document.getElementById('regRole').value;
                const grade = document.getElementById('regGrade').value;
                if (!name) return;
                if (role === 'Student') {
                    schoolData.students.push({ id: "STU"+Date.now(), name, grade, status: "Active", registered: new Date().toISOString().slice(0,10) });
                } else {
                    schoolData.staff.push({ id: "TCH"+Date.now(), name, role: grade, status: "Active" });
                }
                addActivityLog(`➕ Added ${name} (${role})`);
                saveData();
                document.getElementById('regFeedback').innerText = `✅ ${name} added!`;
                setTimeout(() => document.getElementById('regFeedback').innerText = '', 2000);
                renderCurrentTab();
            };
        }
        const viewLogs = document.getElementById('viewAllLogsBtn');
        if (viewLogs) viewLogs.onclick = () => switchTab('logs');
        const clearBtn = document.getElementById('clearLogBtn');
        if (clearBtn) clearBtn.onclick = () => { schoolData.activities = []; addActivityLog("🧹 Log cleared"); renderCurrentTab(); };
        const exportBtn = document.getElementById('exportBtn');
        if (exportBtn) exportBtn.onclick = () => alert("📁 Directory exported (console ready)");
        const syncBtn = document.getElementById('quickActionBtn');
        if (syncBtn) syncBtn.onclick = () => { addActivityLog("🔄 Manual sync completed"); renderCurrentTab(); };
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) logoutBtn.onclick = () => logout();
    }

    window.removeEntry = (name) => {
        schoolData.students = schoolData.students.filter(s => s.name !== name);
        schoolData.staff = schoolData.staff.filter(t => t.name !== name);
        addActivityLog(`❌ Removed: ${name}`);
        saveData();
        renderCurrentTab();
    };

    // INIT
    window.onload = () => {
        if (isLoggedIn()) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('appWrapper').style.display = 'flex';
            loadData();
        }
        document.querySelectorAll('.nav-links li').forEach(li => {
            li.addEventListener('click', () => switchTab(li.getAttribute('data-tab')));
        });
    };
</script>
</body>
</html>
